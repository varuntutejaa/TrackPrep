<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrackPrep — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>

  <!-- Background blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#" class="logo">Track<span>.</span>Prep</a>
    <a href="signup.html" class="nav-link">Don't have an account? <strong>Sign Up</strong></a>
  </nav>

  <!-- Auth Card -->
  <main class="auth-wrapper">
    <div class="auth-card" id="authCard">

      <div class="card-eyebrow">Welcome back</div>
      <h1 class="card-title">LOG<span class="gold">IN</span></h1>
      <p class="card-sub">Track your prep. Land the offer.</p>

      <form class="auth-form" id="loginForm" novalidate>

        <div class="field-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-row">
       <button type="button" id="forgotPassword" class="forgot-link">
  Forgot password?
</button>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Login</span>
          <span class="btn-arrow">→</span>
          <span class="btn-loader" id="loader"></span>
        </button>

        <div class="divider"><span>or continue with</span></div>

       <button type="button" class="btn-social" onclick="googleLogin()">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>
  Continue with Google
</button>
        </div>
      </form>
    </div>

  </main>
<script type="module" src="auth.js"></script>
</body>
</html>
